AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless starter - sample API (REST API), step 1 - no WAF yet, added in a follow-up deploy

Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive CloudWatch alarm notifications
    Default: "you@example.com"
  ApiThrottleRate:
    Type: Number
    Description: Steady-state requests/sec allowed per route
    Default: 100
  ApiThrottleBurst:
    Type: Number
    Description: Burst capacity per route
    Default: 200

Resources:
  # ---------------------------------------------------------------------
  # Lambda function
  # ---------------------------------------------------------------------
  SampleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sample-api
      CodeUri: src/
      Handler: xyz.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 10
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        AnyRequest:
          Type: Api
          Properties:
            RestApiId: !Ref SampleApi
            Path: /{proxy+}
            Method: ANY

  SampleApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sample-api
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # LAYER 2: API Access & Traffic Management
  # REST API (not HttpApi) - required so WAF can attach directly.
  # EndpointConfiguration MUST be REGIONAL: WAF's regional association
  # does not work with the default EDGE (CloudFront-backed) endpoint type.
  # ---------------------------------------------------------------------
  SampleApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: sample-api-gateway
      StageName: prod
      EndpointConfiguration: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "path":"$context.path","status":"$context.status",
          "responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage",
          "latency":"$context.responseLatency"}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ApiThrottleRate
          ThrottlingBurstLimit: !Ref ApiThrottleBurst
          MetricsEnabled: true
          LoggingLevel: INFO

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/sample-api-access-logs
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # Alerting
  # ---------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sample-api-alerts

  AlertTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------
  # Alarms - Lambda
  # ---------------------------------------------------------------------
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-lambda-errors
      AlarmDescription: Lambda error rate is elevated
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SampleApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-lambda-throttles
      AlarmDescription: Lambda invocations are being throttled - traffic is being dropped
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref SampleApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-lambda-duration
      AlarmDescription: Lambda p99 duration is approaching timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p99
      Dimensions:
        - Name: FunctionName
          Value: !Ref SampleApiFunction
      Period: 300
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # ---------------------------------------------------------------------
  # Alarms - API Gateway (REST API)
  # NOTE: metric names/dimensions differ from HttpApi:
  #   - 4XXError / 5XXError (not 4xx / 5xx)
  #   - dimension is ApiName (not ApiId)
  # ---------------------------------------------------------------------
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-5xx-errors
      AlarmDescription: API Gateway 5xx error count is elevated
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: sample-api-gateway
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-4xx-spike
      AlarmDescription: API Gateway 4xx error count spiked (possible bad clients/bot probing)
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: sample-api-gateway
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sample-api-latency-high
      AlarmDescription: API Gateway integration latency (p99) is high
      Namespace: AWS/ApiGateway
      MetricName: IntegrationLatency
      ExtendedStatistic: p99
      Dimensions:
        - Name: ApiName
          Value: sample-api-gateway
        - Name: Stage
          Value: prod
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ApiUrl:
    Description: Your API base URL
    Value: !Sub "https://${SampleApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  AlertTopicArn:
    Description: SNS topic ARN - subscribe additional endpoints here (Slack, PagerDuty, etc.)
    Value: !Ref AlertTopic