AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless starter - sample API

Resources:
  SampleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sample-api
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 10
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        AnyRequest:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  SampleApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sample-api
      RetentionInDays: 14

  # ---------- Users API: REST API (API Gateway v1), explicit routes/methods ----------
  UsersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: users-api
      CodeUri: src/
      Handler: xyz.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 10
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        ListUsers:
          Type: Api
          Properties:
            Path: /users
            Method: get
        CreateUser:
          Type: Api
          Properties:
            Path: /users
            Method: post
        GetUser:
          Type: Api
          Properties:
            Path: /users/{user_id}
            Method: get
        UpdateUser:
          Type: Api
          Properties:
            Path: /users/{user_id}
            Method: put
        PatchUser:
          Type: Api
          Properties:
            Path: /users/{user_id}
            Method: patch
        DeleteUser:
          Type: Api
          Properties:
            Path: /users/{user_id}
            Method: delete

  UsersApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/users-api
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Your API base URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UsersApiUrl:
    Description: Users REST API base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"